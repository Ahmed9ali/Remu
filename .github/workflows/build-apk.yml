name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set or directory does not exist."
            exit 1
          fi

          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect active Java major version."
            exit 1
          fi

          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java 17 or newer verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created or found."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Contents of app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "Error: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "APK verified successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F '/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          RELEASE_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_DIR="${RUNNER_TEMP}/release-assets"

          mkdir -p "$RELEASE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/$RELEASE_ASSET_NAME"

          if [ ! -s "$RELEASE_DIR/$RELEASE_ASSET_NAME" ]; then
            echo "Error: Failed to prepare release asset at $RELEASE_DIR/$RELEASE_ASSET_NAME"
            exit 1
          fi

          echo "Prepared release asset: $RELEASE_DIR/$RELEASE_ASSET_NAME"
          echo "asset_path=$RELEASE_DIR/$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset is missing or empty: $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "::error::Release asset is not an APK file: $ASSET_PATH"
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Publishing release $RELEASE_TAG ($RELEASE_TITLE)..."

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$(cat << 'EOF'
          ### 🤖 Automated Debug APK Build

          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.

          - **Build Run Number:** #${{ github.run_number }}
          - **Build Run Attempt:** #${{ github.run_attempt }}
          - **Source Commit SHA:** `${{ github.sha }}`

          > **Testing Notice:** This APK is intended for testing. The APK is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )"

      - name: Report APK download result
        if: always() && steps.upload_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release published successfully."
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Asset Filename: $ASSET_NAME"
            echo "=================================================="

            gh release view "$RELEASE_TAG"

            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Direct GitHub Release URL: $RELEASE_URL"

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **GitHub Release Published Successfully!**"
              echo ""
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Target Commit:** \`${{ github.sha }}\`"
              echo "- **Direct Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "📱 **Download Instructions:** You can download the APK directly from the **Assets** section of the [GitHub Release page]($RELEASE_URL)."
              echo ""
              echo "📦 **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved under this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was not completed."
            echo "The debug APK build succeeded and the GitHub Actions artifact named app-debug-apk remains available."

            {
              echo "## ⚠️ Debug APK Build & Release Summary"
              echo ""
              echo "⚠️ **GitHub Release Publishing Warning**"
              echo ""
              echo "The debug APK build and artifact upload succeeded."
              echo "However, the GitHub Release could not be published (see step logs for details)."
              echo ""
              echo "📦 **Download from Artifacts:** The verified APK remains available as a GitHub Actions artifact named \`app-debug-apk\` at the bottom of this run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
